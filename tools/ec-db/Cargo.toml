[package]
name = "ec-db"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Adds PGN games to an En Croissant database (its .db3 format), as En Croissant's own import does"

[dependencies]
# The versions En Croissant 0.15.1 is built with: moves are stored as their
# index in shakmaty's legal move list, so this must match.
shakmaty = "=0.27.1"
pgn-reader = "=0.26.0"
btoi = "0.4.3"
rusqlite = { version = "0.28.0", features = ["bundled"] }
